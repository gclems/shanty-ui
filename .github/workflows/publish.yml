name: ✈️ Publish on NPMJS
run-name: ✈️ Publish ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g., 1.0.0)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and enable pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          npm-auth-token: ${{ secrets.NPM_TOKEN }}

      - uses: pnpm/action-setup@v4
        name: Install PNPM
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: |
          pnpm build
        env:
          PNPM_SKIP_BUILD_APPROVAL: 1

      - name: Set version
        run: |
          echo "Setting version to ${{ inputs.version }}"
          pnpm version ${{ inputs.version }} --no-git-tag-version

      - name: Publish to npmjs
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
